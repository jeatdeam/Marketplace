# Blueprint de Render (debe estar en la raiz del repo). Guia: Jeatdeam/integraciones/render/README.md
services:
  - type: web
    name: marketplace-jeatdeam
    runtime: node
    region: virginia        # Render no tiene region en Sudamerica; virginia es la mas cercana a Peru
    plan: free
    branch: main
    autoDeploy: true
    # --include=dev: vite y typescript son devDependencies y hacen falta para compilar el cliente
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # la tienda Next.js en Vercel (url de produccion): a ella se avisa tras cada cambio del dashboard
      # y a ella se mandan las visitas que lleguen a este servidor fuera de /api
      - key: URL_TIENDA
        sync: false
      # mismo valor que REVALIDAR_SECRETO en Vercel (lo pide /api/revalidar de la tienda)
      - key: REVALIDAR_SECRETO
        sync: false
      # sync: false -> Render las pide al crear el servicio (no se guardan en el repo)
      - key: DASHBOARD_CLAVE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_CARPETA
        value: jeatdeam
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
